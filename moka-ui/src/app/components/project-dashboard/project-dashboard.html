<div class="border border-border rounded-2xl flex flex-col gap-2.5 justify-center items-center relative p-4">
    <p class="font-medium text-primary text-4xl">
        Projets
    </p>
    <button (click)="onAddProjectClick()" aria-label="Ajouter un projet" title="Ajouter un Projet" class="h-8 w-8 text-primary hover:text-text absolute top-[3%] right-[5%]">
        <svg lucideIcon="circle-plus" [size]="32"/>
    </button>
    <div class="px-5 py-2.5 min-h-125 flex flex-col gap-2.5 justify-start items-start">
        <div class="flex gap-2.5 p-2.5 rounded-full font-semibold w-full items-center">
            <p class="w-full">
                Noms
            </p>
            <p class="w-45">
                Montants actuels
            </p>
            <p class="w-35">
                Montants finaux
            </p>
            <p class="w-35">
                dates visées
            </p>
            <p class="w-35">
                priorités
            </p>
        </div>

        @for (project of projects(); track project.name) {
            <button (click)="onEditProjectClick()" aria-label="Editer le Projet" class="text-start flex gap-2.5 p-2.5 rounded-full font-normal w-full"
            [style.background]="
            'linear-gradient(to right, var(--color-accent) ' + 
            getProgressPercentage(project.currentAmount, project.targetAmount) + 
            '%, var(--color-card) ' + 
            getProgressPercentage(project.currentAmount, project.targetAmount) + 
            '%)'"
            >
                <p class="w-full">
                    {{ project.name }}
                </p>
                <div class="w-45 flex justify-between items-center">
                    <p>
                        {{ project.currentAmount }} €
                    </p>
                    <button (click)="onAddAmountClick()" aria-label="Ajouter une somme au projet" title="Ajouter une somme au Projet" class="h-4 w-4 text-text hover:text-primary/50">
                        <svg lucideIcon="circle-plus" [size]="16"/>
                    </button>
                </div>
                <p class="w-35">
                    {{ project.targetAmount }} €
                </p>
                <p class="w-35">
                    {{ project.targetDate }}
                </p>
                <p class="w-35">
                    {{ project.priority }}
                </p>
            </button>
        }
    </div>
</div>
