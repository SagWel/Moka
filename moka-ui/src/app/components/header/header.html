<header class="w-full flex justify-between px-12.5 py-5 items-center border-b-3 border-b-border relative">
  <a href="/" class="text-primary hover:text-primary/60">
    <h1 class="text-5xl rounded-2xl border-b-5 border-b-border font-title px-2.5 pb-1">
      Moka
    </h1>
  </a>
    <button [attr.aria-label]="'Choisir un mois (actuel : ' + currentMonth() + ')'" 
    class="flex justify-center text-3xl relative sm:absolute sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 items-center border-4 border-border hover:border-text/80 font-medium hover:text-primary/70 py-1.25 px-2.5 rounded-3xl">
        {{ currentMonth() }}
    </button>
  <div class="flex justify-center items-center gap-8">    
    <p class="hidden lg:block px-2.5 py-1.25 border-b-border border-b-2 text-2xl text-primary border-dashed">
      Maintiens ton compte à flow 
    </p>

    <a href="/profil" class=" flex justify-center items-center font-bold font-title text-text rounded-full hover:text-primary/70 hover:border-border border-3 border-text h-9 w-9 text-center">
      <p>
        {{ user() }}
      </p>
    </a>
  </div>
</header>
