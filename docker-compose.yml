services:
  database:
    image: mongo:latest
    container_name: mongodb_fullstack
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
      MONGO_INITDB_DATABASE: mydatabase
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./moka-api
      dockerfile: DockerFile
    container_name: backend_java
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://admin:secretpassword@database:27017/mydatabase?authSource=admin
    depends_on:
      - database

  frontend:
    build: 
      context: ./moka-ui
      dockerfile: DockerFile
    container_name: frontend_angular
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mongo_data:
